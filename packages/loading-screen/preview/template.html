<title>Play4M3 Loading Screen</title>
<style>
  /* Layout: one full-bleed canvas (the loading screen) plus a small "you continued" panel. */
  :root {
    color-scheme: dark;
    --space: #070914;
    --ink: #eef1ff;
    --dim: #9aa3c7;
    --line: #2a2f52;
    --go: #2fd06b;
    --go-ink: #06240f;
    --display: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  html, body { height: 100%; background: var(--space); color: var(--ink); }
  body { font-family: var(--display); }
  #stage { display: block; width: 100%; height: 100%; touch-action: none; user-select: none; -webkit-user-select: none; outline: none; }
  #done { height: 100%; display: grid; place-items: center; padding-inline: 16px; text-align: center; }
  #done h1 { font-size: clamp(1.6rem, 5vw, 2.6rem); margin: 0 0 0.4rem; text-wrap: balance; }
  #done p { color: var(--dim); margin: 0 0 1.4rem; max-width: 34rem; }
  #again { font: 700 1rem var(--display); color: var(--go-ink); background: var(--go); border: 0; border-radius: 999px; padding: 0.7rem 1.4rem; cursor: pointer; }
  #again:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>

<canvas id="stage" tabindex="0" role="img" aria-label="Play4M3 loading screen. Fly and shoot the screen apart while it loads. When loading is done, press A on a controller, Enter on a keyboard, or the on-screen A button to continue."></canvas>
<div id="live" class="sr-only" aria-live="polite"></div>
<section id="done" hidden>
  <div>
    <h1>You pressed A. Welcome in.</h1>
    <p>In the app, this is where the Creation Station opens. In this preview the loading bar is simulated; in the desktop app it follows real startup steps.</p>
    <button id="again" type="button">Play the loading screen again</button>
  </div>
</section>

<script>/*__BUNDLE__*/</script>
