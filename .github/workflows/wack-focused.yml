name: wack-focused

# Narrow investigation: reuse the corrected AppX already built by run 38050513364.
# No full CI, rebuild, smoke suite, or overall WACK rerun.
on:
  push:
    branches: [codex/wack-focused-fixes]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  selected-checks:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: wack-focused-evidence
          run-id: 38050513364
          github-token: ${{ github.token }}
          path: source-package
      - name: Confirm kit selectors and run only the two investigated checks
        run: |
          New-Item -ItemType Directory -Force evidence | Out-Null
          $kit = "${env:ProgramFiles(x86)}\Windows Kits\10\App Certification Kit\appcert.exe"
          $ids = (& $kit querytestids 2>&1 | Out-String)
          $ids | Out-File evidence/appcert-testids.txt
          if ($ids -notmatch '(?m)^\s*45\s+App resources\s*$' -or $ids -notmatch '(?m)^\s*88\s+Blocked executables\s*$') {
            throw 'Installed kit selectors differ from reviewed discovery; no tests run'
          }
          $pkg = Get-ChildItem source-package -Recurse -Filter *.appx | Select-Object -First 1
          if (-not $pkg) { throw 'Prior corrected package missing' }
          Get-FileHash $pkg.FullName | Format-List | Out-File evidence/package-sha256.txt
          ./scripts/run-wack-selected.ps1 -PackagePath $pkg.FullName -ResourcesTestId 45 -BlockedExecutablesTestId 88
      - name: Unpack the same AppX for interaction tracing
        if: always()
        run: |
          $make = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter makeappx.exe | Where-Object { $_.FullName -like '*x64*' } | Sort-Object FullName -Descending | Select-Object -First 1
          $pkg = Get-ChildItem source-package -Recurse -Filter *.appx | Select-Object -First 1
          & $make.FullName unpack /p $pkg.FullName /d "$PWD\unpacked" /o
          if ($LASTEXITCODE -ne 0) { throw 'Package extraction failed' }
      - name: Trace packaged Station interactions
        if: always()
        shell: powershell
        run: ./scripts/trace-packaged-launch.ps1 -ExecutablePath 'unpacked/app/Creation Station.exe'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: wack-selected-evidence
          path: evidence/**
