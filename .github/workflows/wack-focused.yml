name: wack-focused

# Investigation only: no full CI, smoke suite, or overall WACK rerun.
on:
  push:
    branches: [codex/wack-focused-fixes]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-evidence:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.22.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build corrected package once
        working-directory: apps/desktop
        run: pnpm run dist:appx
      - name: Inspect package and discover installed WACK selectors
        run: |
          New-Item -ItemType Directory -Force evidence | Out-Null
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          Add-Type -AssemblyName System.Drawing
          $pkg = Get-ChildItem apps/desktop/out/*.appx | Select-Object -First 1
          Get-FileHash $pkg.FullName | Format-List | Out-File evidence/package-sha256.txt
          $zip = [IO.Compression.ZipFile]::OpenRead($pkg.FullName)
          try {
            foreach ($spec in @(@('assets/Square150x150Logo.png',150,150), @('assets/Wide310x150Logo.png',310,150))) {
              $entry = $zip.GetEntry($spec[0])
              if (-not $entry) { throw "Missing asset $($spec[0])" }
              $stream = $entry.Open()
              $img = [Drawing.Image]::FromStream($stream)
              try {
                "$($spec[0]): $($img.Width)x$($img.Height)" | Tee-Object -FilePath evidence/asset-dimensions.txt -Append
                if ($img.Width -ne $spec[1] -or $img.Height -ne $spec[2]) { throw 'Invalid dimensions' }
              } finally { $img.Dispose(); $stream.Dispose() }
            }
            $reader = [IO.StreamReader]::new($zip.GetEntry('AppxManifest.xml').Open())
            try { $reader.ReadToEnd() | Out-File evidence/AppxManifest.xml } finally { $reader.Dispose() }
          } finally { $zip.Dispose() }
          $kit = "${env:ProgramFiles(x86)}\Windows Kits\10\App Certification Kit\appcert.exe"
          if (-not (Test-Path $kit)) { throw 'WACK unavailable' }
          & $kit /? 2>&1 | Out-File evidence/appcert-help.txt
          $help = Get-Content evidence/appcert-help.txt -Raw
          if ($help -notmatch 'querytestids') { throw 'Test discovery unavailable; do not run all tests' }
          & $kit querytestids 2>&1 | Tee-Object -FilePath evidence/appcert-testids.txt
          # Selection is intentionally deferred until this installed kit's output is reviewed.
          exit 0
      - name: Observe packaged Electron process launches
        shell: powershell
        run: ./scripts/trace-packaged-launch.ps1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: wack-focused-evidence
          path: |
            evidence/**
            apps/desktop/out/*.appx
